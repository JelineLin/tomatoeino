# 样例：确认 DNS 和证书覆盖 english.jelinelin.com 后再手动启用。
server {
    listen 443 ssl http2;
    server_name english.jelinelin.com;

    ssl_certificate     /etc/letsencrypt/live/english.jelinelin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/english.jelinelin.com/privkey.pem;

    client_max_body_size 20m;

    # 账号删除的内部清除接口只走本机环回：公网一律 404，
    # 不给它任何被爆破共享密钥的机会。menuagent 的 server 块也要加同样一条。
    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8450;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 720s;
    }
}
